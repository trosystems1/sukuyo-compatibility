<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>占星術 - 宿曜占星術</title>
<meta name="description" content="宿曜道と西洋占星術を重ね、12宮・エレメント・惑星と27宿の対応を整理した解説ページです。">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* ── Reset & Tokens ───────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --deep:    #120c24;
  --deep2:   #1c1438;
  --paper:   #f3eff5;
  --paper2:  #e7e0ed;
  --gold:    #c9a961;
  --gold-l:  #e0c785;
  --gold-dim:rgba(201,169,97,.14);
  --moon:    #e8e0f5;
  --ink:     #1a1426;
  --muted:   #6e6285;
  --teal:    #6b4ba8;
  --accent:  #8a6fc4;
  --violet:  #4a2f7a;
  --violet-glow: rgba(139,109,212,.35);
  --border:  rgba(201,169,97,.20);
  --r: 10px;
  --transition: .2s ease;
}

body {
  font-family: 'Noto Serif JP', serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
}

/* ── Header ───────────────────────────────────────────── */
.site-header {
  background: var(--deep);
  padding: calc(18px + env(safe-area-inset-top)) 32px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border);
}
.site-header .logo {
  font-family: 'Shippori Mincho', serif;
  font-size: 18px;
  color: var(--moon);
  letter-spacing: .12em;
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  cursor: pointer;
  transition: opacity var(--transition);
}
.site-header .logo:hover { opacity: .8; }
.logo-moon {
  color: var(--gold-l);
  font-size: 17.5px;
  text-shadow: 0 0 12px var(--violet-glow);
}
.site-header .sep { color: rgba(232,224,245,.25); font-size: 13.5px; }
.site-header .page-name {
  font-size: 13px;
  color: var(--gold);
  letter-spacing: .2em;
  font-family: 'Cinzel', serif;
}
.header-nav {
  margin-left: auto;
  display: flex;
  gap: 24px;
}
.header-nav .nav-link {
  font-size: 15px;
  color: var(--moon);
  text-decoration: none;
  letter-spacing: .04em;
  opacity: .8;
  transition: opacity var(--transition), color var(--transition);
  padding: 4px 0;
  border-bottom: 1px solid transparent;
}
.header-nav .nav-link:hover,
.header-nav .nav-link.active {
  opacity: 1;
  color: var(--gold-l);
  border-bottom-color: var(--gold);
}

/* ── ハンバーガーメニュー（モバイル用） ───────────────────── */
.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  width: 34px;
  height: 34px;
  margin-left: auto;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  flex-shrink: 0;
}
.nav-toggle span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--gold-l, #d9b45c);
  border-radius: 2px;
  transition: transform .22s ease, opacity .22s ease;
}
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

@media (max-width: 640px) {
  .site-header { position: relative; flex-wrap: nowrap; padding-left: 20px; padding-right: 20px; }
  .site-header .sep,
  .site-header .page-name { display: none; }
  .nav-toggle { display: flex; }
  .header-nav {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    flex-direction: column;
    gap: 2px;
    margin-left: 0;
    background: var(--deep);
    border-bottom: 1px solid var(--border);
    padding: 8px 20px 16px;
    z-index: 80;
    box-shadow: 0 12px 24px rgba(0,0,0,.35);
  }
  .header-nav.open { display: flex; }
  .header-nav .nav-link {
    padding: 12px 4px;
    border-bottom: 1px solid rgba(232,224,245,.08);
    white-space: nowrap;
  }
  .header-nav .nav-link:last-child { border-bottom: none; }
}

/* ── Hero ─────────────────────────────────────────────── */
.hero {
  background:
    radial-gradient(1px 1px at 12% 22%, rgba(232,224,245,.9), transparent),
    radial-gradient(1px 1px at 28% 65%, rgba(232,224,245,.7), transparent),
    radial-gradient(1.5px 1.5px at 45% 15%, rgba(232,224,245,.8), transparent),
    radial-gradient(1px 1px at 62% 78%, rgba(232,224,245,.6), transparent),
    radial-gradient(1px 1px at 78% 30%, rgba(232,224,245,.9), transparent),
    radial-gradient(1.5px 1.5px at 88% 60%, rgba(232,224,245,.7), transparent),
    radial-gradient(1px 1px at 35% 85%, rgba(232,224,245,.5), transparent),
    radial-gradient(1px 1px at 95% 12%, rgba(232,224,245,.6), transparent),
    linear-gradient(180deg, var(--deep) 0%, var(--violet) 130%);
  text-align: center;
  padding: 90px 24px 80px;
  position: relative;
  overflow: hidden;
  min-height: 420px;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 80% at 50% 0%, var(--violet-glow) 0%, transparent 70%);
  pointer-events: none;
}
.hero-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: .4em;
  color: var(--gold-l);
  margin-bottom: 14px;
  position: relative;
}
.hero-title {
  font-family: 'Shippori Mincho', serif;
  font-size: clamp(22px, 4vw, 34px);
  color: var(--moon);
  font-weight: 500;
  letter-spacing: .08em;
  position: relative;
  line-height: 1.5;
  margin-bottom: 12px;
}
.hero-sub {
  font-size: 13.5px;
  color: rgba(232,224,245,.5);
  letter-spacing: .08em;
  line-height: 2;
}

/* ── Layout ───────────────────────────────────────────── */
.main-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 40px 20px 80px;
}

/* 横はみ出し・横揺れの防止（モバイルWebView対策） */
html, body {
  overflow-x: hidden;
  overscroll-behavior-x: none;
  max-width: 100%;
}

/* ── Card ─────────────────────────────────────────────── */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 32px 28px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.card-title {
  font-family: 'Shippori Mincho', serif;
  font-size: 16.5px;
  font-weight: 500;
  letter-spacing: .1em;
  color: var(--ink);
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-title::before {
  content: '';
  width: 4px;
  height: 18px;
  background: var(--gold);
  border-radius: 2px;
  flex-shrink: 0;
}
.card-subtitle {
  font-size: 12.5px;
  color: var(--muted);
  letter-spacing: .03em;
  margin: -14px 0 22px;
  line-height: 1.6;
}

/* ── マイページ（プロフィール＋9グループ盤） ─────────────── */
.gtag-filter, .gtag-pick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.gtag-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: inherit; transition: all var(--transition); }
.gtag-btn.active { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.gtag-badge { display: inline-block; font-size: 10px; border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; color: var(--muted); margin-left: 4px; }
.mypage-me { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--r); background: linear-gradient(135deg, var(--deep) 0%, var(--deep2) 100%); }
.mypage-me-kanji { font-family: 'Shippori Mincho', serif; font-size: 34px; color: var(--gold-l); line-height: 1.1; white-space: nowrap; }
.mypage-me-info { min-width: 0; }
.mypage-me-name { font-size: 14px; color: var(--moon); font-weight: 600; margin-bottom: 3px; }
.mypage-me-meta { font-size: 12px; color: rgba(232,224,245,.65); line-height: 1.7; }
.mypage-empty { padding: 14px 16px; border: 1px dashed var(--border); border-radius: var(--r); font-size: 13px; color: var(--muted); line-height: 1.8; }
.mypage-empty a { color: var(--teal); cursor: pointer; text-decoration: underline; }
#book-card { display: block; }
.book-lead { font-size: 13px; color: var(--muted); line-height: 1.8; margin-bottom: 14px; }
.book-viewpoint { font-size: 13px; color: var(--ink); margin-bottom: 10px; line-height: 1.7; }
.book-viewpoint b { color: var(--teal); }
.gboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.gcell { border-radius: 8px; border: 1px solid var(--border); padding: 8px 7px; min-height: 96px; background: rgba(255,255,255,.55); transition: border-color var(--transition); }
.gcell-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.gcell-no { font-size: 11px; color: var(--muted); letter-spacing: .05em; white-space: nowrap; }
.gcell-rel { font-size: 12.5px; font-weight: 600; }
.gcell-sub { font-size: 10px; color: var(--muted); margin: 2px 0 5px; line-height: 1.5; }
.gchip { display: inline-block; background: var(--deep); color: var(--moon); border: 1px solid transparent; border-radius: 20px; padding: 2px 9px; font-size: 11px; margin: 2px 3px 0 0; cursor: pointer; user-select: none; }
.gchip.selected { border-color: var(--gold-l); color: var(--gold-l); box-shadow: 0 0 8px var(--gold-dim); }
.book-hint { font-size: 11.5px; color: var(--muted); margin-bottom: 20px; line-height: 1.7; }
.book-list { border-top: 1px solid var(--border); padding-top: 14px; margin-bottom: 18px; }
.book-list-title { font-size: 13px; color: var(--ink); letter-spacing: .08em; margin-bottom: 8px; font-weight: 600; }
.book-empty { font-size: 12.5px; color: var(--muted); padding: 6px 0; }
.book-row { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px dashed var(--border); font-size: 13px; }
.book-row-name { font-weight: 600; white-space: nowrap; }
.book-row-meta { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; }
.book-del { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; font-size: 11px; padding: 3px 9px; cursor: pointer; font-family: inherit; white-space: nowrap; }
.book-del:hover { border-color: #b04040; color: #b04040; }
.book-add { border-top: 1px solid var(--border); padding-top: 14px; }
.book-add input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff; color: var(--ink); margin-bottom: 10px; }
.book-add-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.book-me-check { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; }
.save-person { margin-top: 18px; padding: 14px; border: 1px dashed var(--border); border-radius: var(--r); display: none; }
.save-person.show { display: block; }
.save-person-row { display: flex; gap: 8px; flex-wrap: wrap; }
.save-person-row input { flex: 1; min-width: 140px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff; color: var(--ink); }
.btn-save-person { white-space: nowrap; }
.save-person-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.save-person-note a { color: var(--teal); cursor: pointer; text-decoration: underline; }

/* ── Top mode tabs (自分を占う / 相性を占う) ─────────────── */
.top-mode-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 28px;
}
@media (max-width: 600px) { .top-mode-tabs { grid-template-columns: 1fr; } }
.top-mode-tab {
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 10px 18px;
  text-align: center;
  cursor: pointer;
  background: #fff;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
}
.top-mode-tab::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0;
  transition: opacity var(--transition);
}
.top-mode-tab:hover { border-color: var(--gold); }
.top-mode-tab.active {
  border-color: var(--gold);
  background: var(--deep);
  color: var(--moon);
}
.top-mode-tab.active::before { opacity: 1; }
.top-mode-icon { font-size: 18px; display: block; margin-bottom: 0; flex-shrink: 0; }
.top-mode-label {
  font-family: 'Shippori Mincho', serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .08em;
  margin-bottom: 0;
}
.top-mode-desc { display: none; }
.top-mode-tab.active .top-mode-desc { display: none; }

#self-card { display: block; }
#self-card.hide { display: none; }
#form-card { display: none; }
#form-card.show { display: block; }

/* ── Loading Wheel（占い計算中のローディング表示） ───────── */
.loading-wheel-wrap {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 48px 0;
}
.loading-wheel-wrap.show { display: flex; }
.loading-wheel-svg-holder svg {
  display: block;
  width: 400px;
  max-width: min(400px, 88vw);
  height: auto;
}
.loading-wheel-outer-ring {
  animation: loadingWheelSpinCW 9s linear infinite;
  transform-origin: 200px 200px;
}
.loading-wheel-inner-ring {
  animation: loadingWheelSpinCCW 6s linear infinite;
  transform-origin: 200px 200px;
}
@keyframes loadingWheelSpinCW {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes loadingWheelSpinCCW {
  from { transform: rotate(0deg); }
  to   { transform: rotate(-360deg); }
}
.loading-wheel-text {
  font-family: 'Shippori Mincho', serif;
  font-size: 14px;
  letter-spacing: .08em;
  color: var(--muted);
  text-align: center;
}

/* ── Result view tabs（結果ページ内：見方を切り替える） ──── */
.result-view-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin: 20px auto 0;
  max-width: 560px;
}
.result-view-tab {
  flex: 1 1 auto;
  min-width: 110px;
  border: 1.5px solid rgba(232,224,245,.35);
  border-radius: 999px;
  padding: 9px 16px;
  font-size: 12.5px;
  letter-spacing: .04em;
  font-family: 'Shippori Mincho', serif;
  font-weight: 500;
  background: rgba(232,224,245,.08);
  color: rgba(232,224,245,.92);
  cursor: pointer;
  transition: all var(--transition);
}
.result-view-tab:hover {
  border-color: var(--gold);
  background: rgba(232,224,245,.16);
  color: var(--moon);
}
.result-view-tab.active {
  border-color: var(--gold);
  background: var(--gold);
  color: #2a1f0a;
  font-weight: 600;
}
@media (max-width: 600px) {
  .result-view-tab { min-width: 0; font-size: 11.5px; padding: 8px 10px; }
}

/* ── Form rows ────────────────────────────────────────── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

.input-mode-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.input-mode-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.mode-btn {
  font-family: 'Noto Serif JP', serif;
  font-size: 12px;
  letter-spacing: .05em;
  padding: 4px 10px;
  background: var(--paper);
  border: none;
  color: var(--muted);
  cursor: pointer;
  transition: all var(--transition);
}
.mode-btn:hover { background: var(--gold-dim); }
.mode-btn.active {
  background: var(--deep);
  color: var(--moon);
}
#b-side-block.self-mode { display: none; }

.form-block { display: flex; flex-direction: column; gap: 8px; }
.form-label {
  font-size: 13px;
  letter-spacing: .15em;
  color: var(--muted);
  font-family: 'Cinzel', serif;
}
.form-label .name-badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 3px;
  font-size: 12px;
  letter-spacing: .1em;
  margin-left: 8px;
  font-family: 'Noto Serif JP', serif;
  vertical-align: middle;
}
.badge-a { background: rgba(201,169,97,.15); color: var(--gold); }
.badge-b { background: rgba(74,63,140,.15); color: var(--accent); }
.badge-corp { background: rgba(31,110,110,.15); color: var(--teal); }

.name-input, .date-input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid rgba(201,169,97,.25);
  border-radius: 8px;
  font-family: 'Noto Serif JP', serif;
  font-size: 15.5px;
  background: var(--paper);
  color: var(--ink);
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.name-input:focus, .date-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,169,97,.12);
}
.input-note {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .06em;
}

/* ── 年月日プルダウン ─────────────────────────────────── */
.date-select-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.date-select {
  padding: 12px 8px;
  border: 1.5px solid rgba(201,169,97,.25);
  border-radius: 8px;
  font-family: 'Noto Serif JP', serif;
  font-size: 15.5px;
  background: var(--paper);
  color: var(--ink);
  outline: none;
  cursor: pointer;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.date-select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,169,97,.12);
}
#self-date-year, #a-date-year, #b-date-year { flex: 1.3; min-width: 90px; }
#self-date-month, #a-date-month, #b-date-month { flex: 1; min-width: 64px; }
#self-date-day, #a-date-day, #b-date-day { flex: 1; min-width: 64px; }
.date-select-unit {
  font-size: 13.5px;
  color: var(--muted);
  letter-spacing: .04em;
}

/* ── Submit ───────────────────────────────────────────── */
.submit-wrap { text-align: center; margin-top: 28px; }
.btn-submit {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 48px;
  background: var(--deep);
  color: var(--moon);
  border: 1.5px solid var(--gold);
  border-radius: 6px;
  font-family: 'Shippori Mincho', serif;
  font-size: 15.5px;
  letter-spacing: .18em;
  cursor: pointer;
  transition: all var(--transition);
}
.btn-submit:hover {
  background: var(--gold);
  color: var(--deep);
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(201,169,97,.25);
}
.btn-submit:disabled { opacity: .5; pointer-events: none; }

/* ── Error ────────────────────────────────────────────── */
.error-msg {
  display: none;
  text-align: center;
  color: #b04040;
  font-size: 13.5px;
  margin-top: 10px;
  letter-spacing: .08em;
}
.error-msg.show { display: block; }

/* ── Result ───────────────────────────────────────────── */
#result { display: none; }
#result.show { display: block; }

.result-header {
  background: linear-gradient(160deg, var(--deep) 0%, var(--violet) 140%);
  border-radius: var(--r) var(--r) 0 0;
  padding: 28px 28px 22px;
  border: 1px solid var(--border);
  border-bottom: none;
  position: relative;
  overflow: hidden;
}
.result-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: .4em;
  color: var(--gold-l);
  margin-bottom: 8px;
}
.result-rel-label {
  font-family: 'Shippori Mincho', serif;
  font-size: 15px;
  color: rgba(232,224,245,.6);
  margin-bottom: 4px;
}

/* Shuku pair row */
.shuku-pair {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.shuku-box {
  text-align: center;
  flex: 1;
  min-width: 120px;
}

.visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
/* ── 12宮オラクル盤 ─────────────────────────────────────── */
/* hero背景として配置（絶対配置・ゴールド線画・自動回転） */
#hero-compass-bg {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  transition: opacity 1.2s ease;
}
#hero-compass-bg.loaded { opacity: 1; }
#hero-compass-bg svg {
  width: min(600px, 140vw);
  height: min(600px, 140vw);
  overflow: visible;
}
/* 外リング：ゆっくり時計回り */
@keyframes compassSlowCW  { from { transform: rotate(0deg);   } to { transform: rotate(360deg);  } }
/* 中リング：ゆっくり反時計回り */
@keyframes compassSlowCCW { from { transform: rotate(0deg);   } to { transform: rotate(-360deg); } }
/* 固定層：静止（宿・12宮・惑星・エレメント） */
#compass-fixed { /* static */ }
/* 回転層：宿＋運気ラベルが一緒にゆっくり反時計回り 100秒/周 */
#compass-ring-compat { animation: compassSlowCCW 100s linear infinite; transform-origin: 220px 220px; }
/* 日付リングは削除済み */

/* heroコンテンツはz-index:1で前面に */

    const shukuList = p.shukuIdx.map(i => SHUKU[i]?.kanji).filter(Boolean);
    const keywords = [...new Set(
      shukuList.flatMap(k => (SHUKU_ORACLE[k]?.keywords || []).slice(0,2))
    )].slice(0,5);
    const oracleKey = shukuList[1] || shukuList[0];
    const oracleTxt = SHUKU_ORACLE[oracleKey]?.oracle || "";
    const iconSvg = (PALACE_ICONS[p.sym] || "").replace(/#c9a961/g, ec);
    return `<div class="astro-palace-card" onclick="this.classList.toggle('open')">
  <div class="astro-palace-head">
    <div class="astro-palace-icon" style="background:${ec}22;border:1px solid ${ec}55;">
      <svg viewBox="-12 -12 24 24" width="28" height="28" overflow="visible" stroke-linecap="round" stroke-linejoin="round">${iconSvg}</svg>
    </div>
    <div>
      <div class="astro-palace-name">${p.name}</div>
      <div class="astro-palace-meta">${p.element}・${p.quality}　守護惑星：${p.planet}</div>
    </div>
    <div class="astro-palace-keyphrase">${p.keyphrase}</div>
  </div>
  <div class="astro-palace-body">
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">対応する宿</div>
    <div class="astro-shuku-tags">${shukuList.map(k=>`<span class="astro-shuku-tag">${k}</span>`).join("")}</div>
    <div class="astro-keywords" style="margin-top:8px;">${keywords.join("　／　")}</div>
    ${oracleTxt ? `<p style="font-size:11.5px;color:#6a5f79;margin-top:10px;line-height:1.85;border-left:2px solid ${ec}55;padding-left:10px;">${oracleTxt}</p>` : ""}
  </div>
</div>`;
  }).join("");
}

function renderAstroElementGrid() {
  const grid = document.getElementById("astro-element-grid");
  if (!grid) return;
  grid.innerHTML = Object.entries(ELEM_DETAIL).map(([,d]) => `
<div class="astro-elem-card">
  <div class="astro-elem-title" style="color:${d.color};">${d.emoji} ${d.title}</div>
  <p style="font-size:12px;color:#5d536f;line-height:1.85;margin-bottom:10px;">${d.desc}</p>
  <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">対応する宮</div>
  <div style="font-size:12px;color:#8c6b22;line-height:2;margin-bottom:8px;">${d.palaces.join(" ／ ")}</div>
  <div style="display:flex;flex-wrap:wrap;gap:5px;">
    ${d.keywords.map(k=>`<span style="font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid ${d.color}44;color:${d.color};background:${d.color}11;">${k}</span>`).join("")}
  </div>
</div>`).join("");
}

function renderAstroQualityGrid() {
  const grid = document.getElementById("astro-quality-grid");
  if (!grid) return;
  grid.innerHTML = QUALITY_DETAIL.map(q => `
<div class="astro-quality-card">
  <div style="font-family:'Cinzel',serif;font-size:9px;letter-spacing:.2em;color:#9a7423;margin-bottom:4px;">${q.en}</div>
  <div class="astro-quality-name">${q.name}</div>
  <p style="font-size:11px;color:#5d536f;line-height:1.85;margin-bottom:8px;">${q.desc}</p>
  <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">該当する宮</div>
  <div style="font-size:12px;color:#2b2338;">${q.palaces.join(" · ")}</div>
</div>`).join("");
}

document.getElementById("astro-filter")?.addEventListener("click", e => {
  const btn = e.target.closest(".astro-filter-btn");
  if (!btn) return;
  document.querySelectorAll(".astro-filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderAstroPalaceGrid(btn.dataset.elem);
});

try {
  renderAstrologyPage();
} catch (err) {
  console.error("renderAstrologyPage failed:", err);
  const grid = document.getElementById("astro-palace-grid");
  if (grid) {
    grid.innerHTML = `<div class="card moon-rune-intro-card" style="color:var(--moon);">占星術ページの描画に失敗しました。</div>`;
  }
}
const navToggleBtn = document.getElementById("nav-toggle");
const headerNavEl = document.getElementById("header-nav");
if (navToggleBtn && headerNavEl) {
  navToggleBtn.addEventListener("click", () => {
    const isOpen = headerNavEl.classList.toggle("open");
    navToggleBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
    navToggleBtn.setAttribute("aria-label", isOpen ? "メニューを閉じる" : "メニューを開く");
  });
}

</script>
</body>
</html>
