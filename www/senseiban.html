<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>占星盤 - 宿曜占星術</title>

<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --deep:    #120c24;
  --deep2:   #1c1438;
  --paper:   #f3eff5;
  --paper2:  #e7e0ed;
  --gold:    #c9a961;
  --gold-l:  #e0c785;
  --gold-dim:rgba(201,169,97,.14);
  --moon:    #e8e0f5;
  --ink:     #1a1426;
  --muted:   #6e6285;
  --violet:  #4a2f7a;
  --violet-glow: rgba(139,109,212,.35);
  --border:  rgba(201,169,97,.20);
  --r: 10px;
  --transition: .2s ease;
}

body {
  font-family: 'Noto Serif JP', serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
}
html, body {
  overflow-x: hidden;
  overscroll-behavior-x: none;
  max-width: 100%;
}

.site-header {
  background: var(--deep);
  padding: calc(18px + env(safe-area-inset-top)) 32px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border);
}
.site-header .logo {
  font-family: 'Shippori Mincho', serif;
  font-size: 18px;
  color: var(--moon);
  letter-spacing: .12em;
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  cursor: pointer;
  transition: opacity var(--transition);
}
.site-header .logo:hover { opacity: .8; }
.logo-moon {
  color: var(--gold-l);
  font-size: 17.5px;
  text-shadow: 0 0 12px var(--violet-glow);
}
.site-header .sep { color: rgba(232,224,245,.25); font-size: 13.5px; }
.site-header .page-name {
  font-size: 13px;
  color: var(--gold);
  letter-spacing: .2em;
  font-family: 'Cinzel', serif;
}
.header-nav {
  margin-left: auto;
  display: flex;
  gap: 24px;
}
.header-nav .nav-link {
  font-size: 15px;
  color: var(--moon);
  text-decoration: none;
  letter-spacing: .04em;
  opacity: .8;
  transition: opacity var(--transition), color var(--transition);
  padding: 4px 0;
  border-bottom: 1px solid transparent;
}
.header-nav .nav-link:hover,
.header-nav .nav-link.active {
  opacity: 1;
  color: var(--gold-l);
  border-bottom-color: var(--gold);
}
.nav-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  width: 34px;
  height: 34px;
  margin-left: auto;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  flex-shrink: 0;
}
.nav-toggle span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--gold-l, #d9b45c);
  border-radius: 2px;
  transition: transform .22s ease, opacity .22s ease;
}
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

@media (max-width: 640px) {
  .site-header { position: relative; flex-wrap: nowrap; padding-left: 20px; padding-right: 20px; }
  .site-header .sep,
  .site-header .page-name { display: none; }
  .nav-toggle { display: flex; }
  .header-nav {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    flex-direction: column;
    gap: 2px;
    margin-left: 0;
    background: var(--deep);
    border-bottom: 1px solid var(--border);
    padding: 8px 20px 16px;
    z-index: 80;
    box-shadow: 0 12px 24px rgba(0,0,0,.35);
  }
  .header-nav.open { display: flex; }
  .header-nav .nav-link {
    padding: 12px 4px;
    border-bottom: 1px solid rgba(232,224,245,.08);
    white-space: nowrap;
  }
  .header-nav .nav-link:last-child { border-bottom: none; }
}

.hero {
  background:
    radial-gradient(1px 1px at 12% 22%, rgba(232,224,245,.9), transparent),
    radial-gradient(1px 1px at 28% 65%, rgba(232,224,245,.7), transparent),
    radial-gradient(1.5px 1.5px at 45% 15%, rgba(232,224,245,.8), transparent),
    radial-gradient(1px 1px at 62% 78%, rgba(232,224,245,.6), transparent),
    radial-gradient(1px 1px at 78% 30%, rgba(232,224,245,.9), transparent),
    radial-gradient(1.5px 1.5px at 88% 60%, rgba(232,224,245,.7), transparent),
    radial-gradient(1px 1px at 35% 85%, rgba(232,224,245,.5), transparent),
    radial-gradient(1px 1px at 95% 12%, rgba(232,224,245,.6), transparent),
    linear-gradient(180deg, var(--deep) 0%, var(--violet) 130%);
  text-align: center;
  padding: 90px 24px 80px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 80% at 50% 0%, var(--violet-glow) 0%, transparent 70%);
  pointer-events: none;
}
.hero-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: .4em;
  color: var(--gold-l);
  margin-bottom: 14px;
  position: relative;
}
.hero-title {
  font-family: 'Shippori Mincho', serif;
  font-size: 30px;
  color: var(--moon);
  font-weight: 500;
  letter-spacing: .08em;
  position: relative;
  line-height: 1.5;
  margin-bottom: 12px;
}
.hero-sub {
  font-size: 13.5px;
  color: rgba(232,224,245,.5);
  letter-spacing: .08em;
  line-height: 2;
  position: relative;
}

.main-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 40px 20px 80px;
}

.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 32px 28px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.card-title {
  font-family: 'Shippori Mincho', serif;
  font-size: 16.5px;
  font-weight: 500;
  letter-spacing: .1em;
  color: var(--ink);
  margin-bottom: 18px;
}
.moon-rune-intro-card { text-align: left; }
.moon-rune-intro-text {
  font-size: 15.5px;
  line-height: 1.9;
  color: var(--muted);
  margin-bottom: 0;
}

.retry-wrap {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 20px 28px;
  text-align: center;
  margin-top: 20px;
}
.btn-retry {
  display: inline-block;
  padding: 10px 28px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 5px;
  font-family: 'Noto Serif JP', serif;
  font-size: 13.5px;
  color: var(--muted);
  cursor: pointer;
  letter-spacing: .12em;
  text-decoration: none;
  transition: all var(--transition);
}
.btn-retry:hover { border-color: var(--gold); color: var(--gold); }

.site-footer {
  background: var(--deep);
  text-align: center;
  padding: 24px;
  font-size: 12px;
  color: rgba(232,224,245,.25);
  letter-spacing: .15em;
  border-top: 1px solid var(--border);
}

.senseiban-wheel-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 32px 0 24px;
}
.senseiban-wheel-holder {
  position: relative;
  width: 420px;
  max-width: min(420px, 92vw);
  touch-action: none;
  user-select: none;
}
.senseiban-wheel-holder svg {
  display: block;
  width: 100%;
  height: auto;
}
.senseiban-inner-ring-group {
  cursor: grab;
}
.senseiban-inner-ring-group.dragging {
  cursor: grabbing;
}
.senseiban-base-label {
  font-family: 'Shippori Mincho', serif;
  font-size: 16px;
  color: var(--ink);
  letter-spacing: .04em;
}
.senseiban-base-label span {
  color: var(--gold);
  font-weight: 500;
}
.senseiban-relation-table-wrap {
  margin-top: 8px;
}
.senseiban-relation-table {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
@media (max-width: 700px) {
  .senseiban-relation-table { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 460px) {
  .senseiban-relation-table { grid-template-columns: 1fr; }
}
.senseiban-relation-cell {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.senseiban-relation-cell.is-base {
  border-color: var(--gold);
  background: var(--gold-dim);
}
.senseiban-relation-badge {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Shippori Mincho', serif;
  font-size: 13px;
  font-weight: 500;
}
.senseiban-relation-name {
  font-size: 13px;
  color: var(--ink);
}
.senseiban-relation-rel {
  font-size: 11px;
  color: var(--muted);
}


@media (max-width: 900px) {
  .header-nav { gap: 14px; }
  .header-nav .nav-link { font-size: 13.5px; }
}
</style>
</head>

function getRelation(idxA, idxB) {
  // 【2026/6 再修正】kosei-do.co.jp(Takemoto-sensei公式サイト)の占星盤解説ページ
  // (https://kosei-do.co.jp/details/senseiban.html) の実例データと27件全件照合した結果、
  // diffの方向は (idxA - idxB) が正しいことが判明（従来は (idxB - idxA) で逆方向だった）
  const diff = ((idxA - idxB) % 27 + 27) % 27;
  return { ...COMPAT_TABLE[diff], diff };
}

let senseibanRotation = 0; // 現在の内側リング回転角度（度）
let senseibanBaseIdx = 0;  // 現在の基準宿のSHUKUインデックス

function buildSenseibanSVG() {
  const cx = 210, cy = 210;
  const outerR = 185, innerR = 118;
  const N = 27;

  const relationRing = COMPAT_TABLE.map(r => r.key);
  const outerNames = SHUKU.map(s => s.kanji.replace("宿", ""));

  function ringText(items, radius, fontSize, extraClass, extraAttrs) {
    return items.map((label, i) => {
      const angle = (i / N) * 360 - 90;
      const rad = angle * Math.PI / 180;
      const x = cx + radius * Math.cos(rad);
      const y = cy + radius * Math.sin(rad);
      const rot = angle + 90;
      return `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" class="${extraClass}" font-size="${fontSize}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${rot.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)})" ${extraAttrs||""}>${label}</text>`;
    }).join("");
  }

  return `
<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="senseibanBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fdfaf4"/>
      <stop offset="100%" stop-color="#f3ecdd"/>
    </radialGradient>
  </defs>
  <circle cx="${cx}" cy="${cy}" r="205" fill="url(#senseibanBg)" stroke="#c9a961" stroke-width="1.5"/>

  <!-- 外側リング：27宿（固定） -->
  <g>
    <circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="rgba(74,47,122,.25)" stroke-width="1"/>
    <circle cx="${cx}" cy="${cy}" r="${outerR - 38}" fill="none" stroke="rgba(74,47,122,.18)" stroke-width="1"/>
    <g fill="#241b3e">${ringText(outerNames, outerR - 19, 14, "senseiban-outer-text")}</g>
  </g>

  <!-- 内側リング：11分類の運勢ワード（ドラッグで回転） -->
  <g class="senseiban-inner-ring-group" id="senseiban-inner-ring-group" transform="rotate(0 ${cx} ${cy})">
    <circle cx="${cx}" cy="${cy}" r="${innerR}" fill="#fff" stroke="rgba(201,169,97,.5)" stroke-width="1"/>
    <circle cx="${cx}" cy="${cy}" r="${innerR - 36}" fill="none" stroke="rgba(201,169,97,.3)" stroke-width="1"/>
    <g fill="#b8953a">${ringText(relationRing, innerR - 18, 15, "senseiban-inner-text")}</g>
  </g>

  <!-- 基準点マーカー（12時位置） -->
  <polygon points="${cx-8},${cy-outerR-2} ${cx+8},${cy-outerR-2} ${cx},${cy-outerR+14}" fill="#c9a961"/>

  <circle cx="${cx}" cy="${cy}" r="${innerR - 38}" fill="rgba(253,250,244,.9)" stroke="rgba(201,169,97,.4)" stroke-width="1"/>
  <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="28" fill="#4a3f8c">☽</text>
</svg>`;
}

function renderSenseibanRelationTable() {
  const table = document.getElementById("senseiban-relation-table");
  const baseIdx = senseibanBaseIdx;
  const cells = SHUKU.map((s, idx) => {
    const rel = getRelation(baseIdx, idx);
    const isBase = idx === baseIdx;
    return `
      <div class="senseiban-relation-cell ${isBase ? "is-base" : ""}">
        <div class="senseiban-relation-badge" style="background:${rel.color}22; color:${rel.color};">${rel.key}</div>
        <div>
          <div class="senseiban-relation-name">${s.kanji}（${s.yomi}）</div>
          <div class="senseiban-relation-rel">${isBase ? "基準（命）" : rel.name}</div>
        </div>
      </div>`;
  }).join("");
  table.innerHTML = cells;
}

function updateSenseibanBase() {
  // 内側リングの回転角度から、12時位置に来ている外側の宿（基準）を逆算する
  // 内側リングが時計回りに回転すると、相対的に基準点は反時計回りに動く
  const N = 27;
  const anglePerSlot = 360 / N;
  // senseibanRotationは「内側リングが何度回転したか」。0番目の宿（昴）が基準のとき回転0度。
  const rawIdx = Math.round((-senseibanRotation / anglePerSlot)) % N;
  const idx = ((rawIdx % N) + N) % N;
  senseibanBaseIdx = idx;
  document.getElementById("senseiban-base-shuku").textContent = SHUKU[idx].kanji;
  renderSenseibanRelationTable();
}

function initSenseibanDrag() {
  const holder = document.getElementById("senseiban-wheel-holder");
  const group = document.getElementById("senseiban-inner-ring-group");
  if (!holder || !group || holder.dataset.dragInit) return;
  holder.dataset.dragInit = "true";

  const svg = holder.querySelector("svg");
  const cx = 210, cy = 210;
  let dragging = false;
  let startAngle = 0;
  let startRotation = 0;

  function getSvgPoint(clientX, clientY) {
    const rect = svg.getBoundingClientRect();
    const scale = 420 / rect.width; // viewBoxは0 0 420 420
    const x = (clientX - rect.left) * scale;
    const y = (clientY - rect.top) * scale;
    return { x, y };
  }

  function angleAt(clientX, clientY) {
    const p = getSvgPoint(clientX, clientY);
    return Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI;
  }

  function onPointerDown(e) {
    dragging = true;
    group.classList.add("dragging");
    const point = e.touches ? e.touches[0] : e;
    startAngle = angleAt(point.clientX, point.clientY);
    startRotation = senseibanRotation;
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!dragging) return;
    const point = e.touches ? e.touches[0] : e;
    const currentAngle = angleAt(point.clientX, point.clientY);
    const delta = currentAngle - startAngle;
    senseibanRotation = startRotation + delta;
    group.setAttribute("transform", `rotate(${senseibanRotation.toFixed(2)} ${cx} ${cy})`);
    e.preventDefault();
  }

  function onPointerUp() {
    if (!dragging) return;
    dragging = false;
    group.classList.remove("dragging");
    // 27分割の最も近い角度にスナップ
    const anglePerSlot = 360 / 27;
    const snapped = Math.round(senseibanRotation / anglePerSlot) * anglePerSlot;
    senseibanRotation = snapped;
    group.setAttribute("transform", `rotate(${senseibanRotation.toFixed(2)} ${cx} ${cy})`);
    updateSenseibanBase();
  }

  holder.addEventListener("mousedown", onPointerDown);
  window.addEventListener("mousemove", onPointerMove);
  window.addEventListener("mouseup", onPointerUp);
  holder.addEventListener("touchstart", onPointerDown, { passive: false });
  window.addEventListener("touchmove", onPointerMove, { passive: false });
  window.addEventListener("touchend", onPointerUp);
}

const holder = document.getElementById("senseiban-wheel-holder");
holder.innerHTML = buildSenseibanSVG();
initSenseibanDrag();
renderSenseibanRelationTable();

</script>
